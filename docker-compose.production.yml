# Production Docker Compose for app.eximpoglobal.net
# Uses VPS PostgreSQL (not Docker container)
version: '3.8'

services:
  # Backend (Node.js API)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        - NODE_ENV=production
    container_name: eximpo-backend-prod
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - DATABASE_URL=postgresql://eximpo_user:Eximpo2025Secure@host.docker.internal:5432/eximpo
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRES_IN=7d
      - CORS_ORIGIN=https://app.eximpoglobal.net
      - BREVO_API_KEY=${BREVO_API_KEY}
      - EMAIL_FROM=${EMAIL_FROM:-noreply@eximpoglobal.net}
      - EMAIL_FROM_NAME=Eximpo
      - FRONTEND_URL=https://app.eximpoglobal.net
      - MAX_FILE_SIZE=${MAX_FILE_SIZE:-10485760}
      - ALLOWED_FILE_TYPES=${ALLOWED_FILE_TYPES:-pdf,doc,docx,jpg,jpeg,png}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - eximpo-network
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '1.0'
          memory: 512M

  # Frontend (React + Vite) - Built with relative paths
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NODE_ENV=production
    container_name: eximpo-frontend-prod
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - eximpo-network
    restart: always
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M

  # Admin Panel
  admin:
    build:
      context: ./admin
      dockerfile: Dockerfile
      args:
        - VITE_API_BASE_URL=https://app.eximpoglobal.net/api
        - NODE_ENV=production
    container_name: eximpo-admin-prod
    ports:
      - "3001:80"
    depends_on:
      - backend
    networks:
      - eximpo-network
    restart: always
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M

networks:
  eximpo-network:
    driver: bridge
